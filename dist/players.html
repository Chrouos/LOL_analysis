<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>選手分析 · LOL 賽事數據</title><link rel="stylesheet" href="./dashboard.css?v=6"></head>
<body>
<header class="site-header"><div><a class="brand" href="./index.html">LOL 賽事數據</a><nav class="nav" aria-label="主要導覽"><a href="./index.html">賽區</a><a href="./players.html" aria-current="page">選手</a><a href="./teams.html">隊伍</a><a href="./backtest.html">回測</a><a href="./sources.html">資料來源</a></nav></div></header>
<main><div class="page-title"><p class="eyebrow">2025 賽季 · LCK／LPL／世界賽</p><h1>選手分析</h1></div>
<p id="status" role="status">載入中</p>
<div class="controls"><label>比賽場域<select id="venue"><option value="">全部</option><option>LCK</option><option>LPL</option><option value="WLDs">世界賽</option></select></label><label>隊伍賽區<select id="region"><option value="">全部</option></select></label><label>隊伍<select id="team"><option value="">全部</option></select></label><label>選手<input type="search" id="player" placeholder="搜尋 ID"></label><label>競賽版本<select id="patch"><option value="">全部版本</option></select></label>
<label>開始日<input type="date" id="start-date"></label><label>結束日<input type="date" id="end-date"></label>
<button type="button" class="clear-dates" id="clear-dates">清除版本與日期</button></div>
<p class="scope" id="selected-scope" role="status"></p>
<section class="player-panel"><h2>英雄使用率</h2>
<div id="player-picker" class="player-picker" role="group" aria-label="選擇選手"></div>
<div class="player-layout"><div id="player-profile"></div><div id="player-chart" aria-live="polite"></div></div></section><section><h2>選手英雄使用</h2><div class="scroll" id="players"></div><p class="note">依場域、隊伍與位置計算。顯示前五名，搜尋選手可查看完整英雄分布。</p></section>
</main><footer>資料來源 <a href="https://github.com/cbplexiglass/LoL-Esports-Regional-Analyses/blob/main/2025_LoL_esports_match_data_from_OraclesElixir.csv">Oracle’s Elixir 2025 快照</a> · 地圖與圖示 © Riot Games，取自 <a href="https://raw.communitydragon.org/15.20/game/assets/">CommunityDragon</a> · <a href="https://github.com/Chrouos/LOL_analysis">GitHub</a></footer><footer>選手照片 <a href="https://www.t1.gg/teams/leagueoflegends">T1</a> · <a href="https://lol.fandom.com/wiki/Chovy">Leaguepedia</a> · <a href="https://gamedaily.com/games/league-of-legends-msi-2026-top-players-to-watch">GameDaily</a></footer>
<script type="module" src="./dashboard.mjs?v=6"></script>
</body></html>
