<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOL 賽事數據</title>
<style>
:root{color-scheme:dark;--bg:#101219;--panel:#191d28;--line:#303647;--ink:#f3f3f8;--muted:#b2bace;--lime:#d8fc71}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,sans-serif}main,footer{max-width:1280px;margin:auto;padding:24px}h1{margin:4px 0;font-size:clamp(2rem,5vw,3.4rem);color:var(--lime)}h2{margin:0 0 12px;font-size:1.2rem}p,footer{color:var(--muted)}a{color:var(--lime)}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}label{display:grid;gap:4px;color:var(--muted);font-size:.875rem}select,input{font:inherit;color:var(--ink);background:#242a39;border:1px solid #414960;border-radius:6px;padding:7px 10px}section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:14px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;text-align:left}th,td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:.875rem;color:var(--muted)}caption{text-align:left;color:var(--muted);padding-bottom:8px}.note{font-size:.875rem;margin:8px 0 0}@media(max-width:600px){main,footer{padding:14px}}
</style>
<main>
<h1>LOL 賽事數據</h1>
<p>2025 賽季 · LCK／LPL／世界賽</p>
<p id="status" role="status">載入中</p>
<div class="controls">
<label>比賽場域<select id="venue"><option value="">全部</option><option>LCK</option><option>LPL</option><option value="WLDs">世界賽</option></select></label>
<label>隊伍賽區<select id="region"><option value="">全部</option></select></label>
<label>隊伍<select id="team"><option value="">全部</option></select></label>
<label>選手<input type="search" id="player" placeholder="搜尋 ID"></label>
</div>
<section><h2>賽前回測</h2><div class="scroll" id="backtest"></div><p class="note">4/1 起逐日回測，僅使用前一日及更早的資料。基準為同場域歷史結果頻率。模型加入隊伍、時間與版本權重。Log loss 越低越好。</p></section>
<section><h2>場域物件分布</h2><div class="scroll" id="observed"></div></section>
<section><h2>隊伍表現</h2><div class="scroll" id="teams"></div><p class="note">取得率以有紀錄局數為分母，包含未取得物件的對局。預示者在只有唯一取得方時可由總數推得。</p></section>
<section><h2>選手英雄使用</h2><div class="scroll" id="players"></div><p class="note">依場域、隊伍與位置計算。顯示前五名，搜尋選手可查看完整英雄分布。</p></section>
<section id="cross-section"><h2>世界賽賽區交手</h2><div class="scroll" id="cross"></div></section>
</main>
<footer>資料來源 <a href="https://github.com/cbplexiglass/LoL-Esports-Regional-Analyses/blob/main/2025_LoL_esports_match_data_from_OraclesElixir.csv">Oracle’s Elixir 2025 快照</a> · <a href="https://github.com/Chrouos/LOL_analysis">GitHub</a></footer>
<script type="module" src="./dashboard.mjs"></script>
</html>
